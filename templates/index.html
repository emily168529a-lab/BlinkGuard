@"
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlinkGuard - Localhost Monitor</title>
  <style>
    /* Color Palette Configuration */
    :root {
      --ocean-deep: #4E635E;   /* Deep greenish slate - Main Background */
      --villa-nova: #E2E0CB;   /* Soft warm cream - Primary Highlights & Accents */
      --siren-song: #A6B49E;   /* Pale sage green - Borders & Soft Text */
      --big-river: #818C7B;    /* Olive-gray - Secondary Container Accents */
      
      --text-main: #E2E0CB;
      --text-muted: #A6B49E;
    }

    body {
      background-color: var(--ocean-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      max-width: 600px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--villa-nova);
    }

    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin: 0;
      line-height: 1.5;
    }

    .video-container {
      border: 4px solid var(--siren-song);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      background-color: var(--big-river);
      transition: border-color 0.3s ease;
    }

    .video-container:hover {
      border-color: var(--villa-nova);
    }

    img {
      display: block;
      width: 640px;
      height: 480px;
      object-fit: cover;
    }

    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.8;
      display: flex;
      gap: 16px;
    }

    .color-chip {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header>
    <h1>BlinkGuard</h1>
    <p>Preventing Computer Vision Syndrome locally using real-time computer vision.</p>
  </header>

  <div class="video-container">
    <img src="/video_feed" alt="Live Camera Feed">
  </div>

  <footer>
    <span><span class="color-chip" style="background-color: var(--ocean-deep);"></span>Ocean Deep</span>
    <span><span class="color-chip" style="background-color: var(--villa-nova);"></span>Villa Nova</span>
    <span><span class="color-chip" style="background-color: var(--siren-song);"></span>Siren Song</span>
    <span><span class="color-chip" style="background-color: var(--big-river);"></span>Big River</span>
  </footer>

</body>
</html>
"@ | Out-File -FilePath "templates\index.html" -Encoding utf8
